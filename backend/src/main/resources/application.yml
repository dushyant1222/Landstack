spring:
  application:
    name: landstack
  datasource:
    url: ${LANDSTACK_DB_URL:jdbc:postgresql://localhost:5432/landstack}
    username: ${LANDSTACK_DB_USER:landstack}
    password: ${LANDSTACK_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 200
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never   # created by Flyway V2
      table-name: SPRING_SESSION
    timeout: ${LANDSTACK_SESSION_TIMEOUT:30m}
  servlet:
    multipart:
      max-file-size: ${LANDSTACK_MAX_UPLOAD_MB:20}MB
      max-request-size: ${LANDSTACK_MAX_UPLOAD_MB:20}MB
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
      thread-name-prefix: landstack-worker-

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${LANDSTACK_SESSION_TIMEOUT:30m}
      cookie:
        name: LANDSTACK_SESSION
        http-only: true
        same-site: lax
        secure: ${LANDSTACK_COOKIE_SECURE:false}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMINISTRATOR

springdoc:
  api-docs:
    enabled: ${LANDSTACK_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${LANDSTACK_API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
    edu.iitp.landstack: INFO
    org.apache.poi: WARN

landstack:
  storage:
    dir: ${LANDSTACK_STORAGE_DIR:}
  upload:
    max-bytes: ${LANDSTACK_MAX_UPLOAD_BYTES:20971520}
  parsing:
    max-rows: ${LANDSTACK_MAX_ROWS:10000}
    max-columns: 100
    max-cell-length: 4000
    max-pdf-pages: 50
  processing:
    enabled: ${LANDSTACK_PROCESSING_ENABLED:true}
    url: ${LANDSTACK_PROCESSING_URL:http://localhost:8090}
    token: ${LANDSTACK_PROCESSING_TOKEN:}
    connect-timeout: 5s
    read-timeout: 70s
  security:
    cors-origins: ${LANDSTACK_CORS_ORIGINS:http://localhost:5173}
    login-max-attempts: 5
    login-window: 15m
    public-api-docs: ${LANDSTACK_API_DOCS_ENABLED:false}
    ip-hash-salt: ${LANDSTACK_IP_HASH_SALT:landstack-dev-salt}
  privacy:
    mask-owner-for-reviewer: true
  quality:
    rules-version: rules-1.0
    area-min-sqm: 1
    area-max-sqm: 10000000
    conflicting-area-tolerance: 0.01
    statistical-min-group-size: 8
    statistical-iqr-multiplier: 3.0
  retention:
    staging-days: 7
    abandoned-job-days: 7
    cron: "0 30 2 * * *"
  export:
    max-rows: 10000
  bootstrap:
    admin-email: ${LANDSTACK_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${LANDSTACK_BOOTSTRAP_ADMIN_PASSWORD:}
  seed:
    demo-users: false
    demo-password: ${LANDSTACK_DEMO_PASSWORD:}
